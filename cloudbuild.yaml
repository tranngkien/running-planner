# Build image và đẩy lên Artifact Registry.
# Dùng: gcloud builds submit --config cloudbuild.yaml --region=asia-southeast1
substitutions:
  _REGION: asia-southeast1
  _REPO: running-planner

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest
